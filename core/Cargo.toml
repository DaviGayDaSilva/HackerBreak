[package]
name = "hacker-break-core"
version = "1.0.0"
edition = "2021"
authors = ["Hacker Break Team"]
description = "Hacker Break - Advanced cybersecurity defense system"

[lib]
name = "hacker_break_core"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.10"

[features]
default = []
secure = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true